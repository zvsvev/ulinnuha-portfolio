<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Classic Instagram (2010–2016) camera: rounded-square brown/orange tile -->
  <defs>
    <linearGradient id="ig-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b3f16"/>
      <stop offset="0.55" stop-color="#8a4b1f"/>
      <stop offset="1" stop-color="#c9702a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#ig-bg)"/>
  <!-- camera body outline -->
  <rect x="12" y="20" width="40" height="26" rx="5" fill="none" stroke="#fff" stroke-width="3.4"/>
  <!-- top hump -->
  <rect x="12" y="13" width="14" height="8" rx="2.5" fill="#fff"/>
  <!-- viewfinder dot -->
  <circle cx="49" cy="16.5" r="2.6" fill="#fff"/>
  <!-- lens ring -->
  <circle cx="32" cy="33" r="9" fill="none" stroke="#fff" stroke-width="3.2"/>
  <!-- lens inner ring -->
  <circle cx="32" cy="33" r="3.4" fill="#fff"/>
</svg>
