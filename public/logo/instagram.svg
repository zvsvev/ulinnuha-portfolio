<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Instagram</title>
  <!-- Instagram app icon, 2010-2016 era: sepia/brown skeuomorphic camera -->
  <defs>
    <linearGradient id="igTile" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#a57446"/>
      <stop offset="0.42" stop-color="#7d4f27"/>
      <stop offset="1" stop-color="#573317"/>
    </linearGradient>
    <linearGradient id="igBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfa273"/>
      <stop offset="0.45" stop-color="#9d6e3d"/>
      <stop offset="1" stop-color="#6b431f"/>
    </linearGradient>
    <linearGradient id="igHump" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcb383"/>
      <stop offset="1" stop-color="#8a5f34"/>
    </linearGradient>
    <linearGradient id="igRing" x1="0.15" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#eac79a"/>
      <stop offset="0.5" stop-color="#a17544"/>
      <stop offset="1" stop-color="#5c3a1b"/>
    </linearGradient>
    <radialGradient id="igGlass" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#a9cde4"/>
      <stop offset="0.32" stop-color="#53789a"/>
      <stop offset="0.68" stop-color="#2c3f52"/>
      <stop offset="1" stop-color="#161f29"/>
    </radialGradient>
    <linearGradient id="igRainbow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f5c400"/>
      <stop offset="0.28" stop-color="#ec6b23"/>
      <stop offset="0.55" stop-color="#d92e6f"/>
      <stop offset="0.8" stop-color="#8a3fb0"/>
      <stop offset="1" stop-color="#4a63c8"/>
    </linearGradient>
    <linearGradient id="igSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="igClip"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#igClip)">
    <rect width="64" height="64" fill="url(#igTile)"/>

    <!-- signature rainbow band hugging the bottom-right corner -->
    <path d="M64 44 L64 52 L52 64 L44 64 Z" fill="url(#igRainbow)"/>

    <!-- camera body -->
    <rect x="10.5" y="21" width="43" height="25.5" rx="4.5" fill="url(#igBody)" stroke="#4d2f14" stroke-width="1"/>
    <rect x="12" y="22.4" width="40" height="3.2" rx="1.6" fill="#ffffff" opacity="0.16"/>

    <!-- viewfinder hump -->
    <rect x="13.5" y="14" width="15.5" height="9.5" rx="2.5" fill="url(#igHump)" stroke="#4d2f14" stroke-width="1"/>
    <rect x="16.6" y="16.6" width="9" height="4.6" rx="1.2" fill="#33240f"/>
    <rect x="16.6" y="16.6" width="9" height="1.6" rx="0.8" fill="#7d6a4e" opacity="0.7"/>

    <!-- flash -->
    <ellipse cx="48.2" cy="18.2" rx="4.1" ry="3.2" fill="url(#igHump)" stroke="#4d2f14" stroke-width="1"/>
    <ellipse cx="48.2" cy="18" rx="2" ry="1.4" fill="#f7e8cd" opacity="0.85"/>

    <!-- lens: bevelled ring, barrel, glass, specular highlight -->
    <circle cx="32" cy="33.6" r="11.4" fill="url(#igRing)" stroke="#452a11" stroke-width="1"/>
    <circle cx="32" cy="33.6" r="8.6" fill="#6d4623"/>
    <circle cx="32" cy="33.6" r="8.6" fill="none" stroke="#8a5c30" stroke-width="1"/>
    <circle cx="32" cy="33.6" r="6.6" fill="url(#igGlass)"/>
    <ellipse cx="29.1" cy="30.3" rx="2.7" ry="1.7" transform="rotate(-28 29.1 30.3)" fill="#ffffff" opacity="0.6"/>
    <circle cx="35" cy="37.4" r="1.5" fill="#cfe4f2" opacity="0.35"/>

    <!-- faint glass sheen over the whole tile -->
    <rect width="64" height="64" fill="url(#igSheen)" opacity="0.6"/>
  </g>
</svg>
