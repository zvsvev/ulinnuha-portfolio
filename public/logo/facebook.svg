<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Facebook</title>
  <!-- Facebook app icon, 2005-2019 era: #3b5998 tile with the bottom-flush white f -->
  <defs>
    <linearGradient id="fbTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b67a1"/>
      <stop offset="0.55" stop-color="#3f5c9c"/>
      <stop offset="1" stop-color="#35528f"/>
    </linearGradient>
    <clipPath id="fbClip"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#fbClip)">
    <rect width="64" height="64" fill="url(#fbTile)"/>

    <!-- classic lowercase f, stem flush with the bottom edge -->
    <path
      d="M35.5 64 L35.5 40 L27.5 40 L27.5 31 L35.5 31 L35.5 25.5
         C35.5 17.5 39.5 14 47.5 14 L54 14 L54 23 L49 23
         C45.8 23 44.5 24.6 44.5 27.8 L44.5 31 L53 31 L51.8 40 L44.5 40
         L44.5 64 Z"
      fill="#ffffff"/>
  </g>
</svg>
